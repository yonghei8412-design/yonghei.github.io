<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercedes-Benz Price Guide | 구용회 팀장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Noto+Serif+KR:wght@200;300;400;500&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:#f7f7f5;
  color:#141414;
  font-size:14px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

/* ── TOKENS ── */
:root{
  --ink:#111111;
  --ink2:#383838;
  --muted:#888;
  --muted2:#bbb;
  --line:#e0e0de;
  --line2:#cacac8;
  --bg:#ffffff;
  --bg2:#f5f5f3;
  --bg3:#ececea;
  --red:#b02a1e;
  --blue:#1150a0;
  --green:#185e36;
  --amg:#8a1a1a;
}

/* ═══════════════════════════
   HEADER
═══════════════════════════ */
.site-header{
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:0 32px;
  position:sticky;top:0;z-index:300;
  box-shadow:0 1px 0 var(--line);
}
.sh-util{
  display:flex;align-items:center;gap:14px;
  height:32px;border-bottom:1px solid var(--line);
}
.sh-back{
  font-size:11px;color:var(--muted);
  text-decoration:none;letter-spacing:.04em;
  display:flex;align-items:center;gap:5px;
  transition:color .2s;
}
.sh-back:hover{color:var(--ink)}
.sh-util-sep{color:var(--line2);font-size:11px}
.sh-util-date{font-size:10px;color:var(--muted2);letter-spacing:.16em;text-transform:uppercase}
.sh-main{
  display:flex;align-items:center;justify-content:space-between;
  height:54px;
}
.sh-identity{display:flex;align-items:center;gap:0}
.sh-dealer{
  font-size:10px;color:var(--muted);letter-spacing:.14em;
  text-transform:uppercase;font-weight:300;
  padding-right:16px;border-right:1px solid var(--line2);margin-right:16px;
}
.sh-name{
  font-family:'Playfair Display',serif;
  font-size:19px;font-weight:600;color:var(--ink);letter-spacing:.01em;
}
.sh-phone a{
  font-family:'Playfair Display',serif;
  font-size:19px;font-weight:600;color:var(--ink);
  text-decoration:none;letter-spacing:.02em;
  padding-bottom:2px;border-bottom:2px solid transparent;
  transition:border-color .2s;
}
.sh-phone a:hover{border-bottom-color:var(--ink)}
@media(max-width:700px){
  .site-header{padding:0 16px}
  .sh-phone{display:none}
  .sh-dealer{display:none}
  .sh-name{font-size:16px}
}

/* ═══════════════════════════
   NAV
═══════════════════════════ */
.nav-wrap{
  background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:86px;z-index:290;
  overflow:hidden;
}
.nav-inner-wrap{position:relative}
.nav-inner{
  display:flex;white-space:nowrap;
  padding:0 28px;
  overflow-x:auto;scrollbar-width:none;
}
.nav-inner::-webkit-scrollbar{display:none}
.nav-inner a{
  display:inline-flex;align-items:center;
  padding:0 11px;height:40px;
  font-size:12px;color:var(--muted);text-decoration:none;
  border-bottom:2px solid transparent;
  transition:color .18s,border-color .18s;
  white-space:nowrap;letter-spacing:.01em;flex-shrink:0;
}
.nav-inner a:hover,.nav-inner a.hot{color:var(--ink);border-bottom-color:var(--ink)}
.nav-inner a.hot{font-weight:600}
.nav-fade{
  position:absolute;right:0;top:0;bottom:0;width:52px;
  background:linear-gradient(to right,transparent,#fff 80%);
  pointer-events:none;
  display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
  transition:opacity .25s;
}
.nav-fade.gone{opacity:0}
.nav-hint{font-size:17px;color:var(--muted2);animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:.25}55%{transform:translateX(5px);opacity:.9}}
@media(max-width:700px){
  .nav-wrap{top:76px}
  .nav-inner{padding:7px 14px;gap:6px;height:auto;align-items:center}
  .nav-inner a{
    height:28px;padding:0 12px;font-size:11.5px;
    border:1px solid var(--line2);border-radius:14px;border-bottom:1px solid var(--line2);
    background:#fff;
  }
  .nav-inner a:hover,.nav-inner a.hot{
    background:var(--ink);color:#fff;border-color:var(--ink);
  }
}
@media(max-width:700px){.site-header .sh-util{height:28px}.sh-main{height:48px}}

/* ═══════════════════════════
   HERO
═══════════════════════════ */
.hero{
  background:var(--ink);
  padding:80px 32px 72px;
  text-align:center;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1;max-width:680px;margin:0 auto}
.hero-kicker{
  font-size:11px;letter-spacing:.36em;text-transform:uppercase;
  color:rgba(255,255,255,.35);font-weight:300;
  margin-bottom:32px;
}
.hero-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(36px,6vw,64px);
  font-weight:300;color:#fff;
  letter-spacing:.08em;line-height:1;
  margin-bottom:8px;
}
.hero-collection{
  font-family:'Playfair Display',serif;
  font-size:clamp(12px,1.8vw,15px);
  font-weight:300;font-style:italic;
  color:rgba(255,255,255,.38);
  letter-spacing:.22em;
  margin-bottom:40px;
}
.hero-rule{
  width:1px;height:48px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.25),transparent);
  margin:0 auto 40px;
}
.hero-sub{
  font-family:'Noto Serif KR',serif;
  font-size:15px;font-weight:300;
  color:rgba(255,255,255,.55);letter-spacing:.06em;
  margin-bottom:8px;
}
.hero-meta{
  font-size:12.5px;color:rgba(255,255,255,.45);letter-spacing:.08em;
}
@media(max-width:700px){
  .hero{padding:44px 20px 40px}
  .hero-title{font-size:clamp(30px,8vw,44px)}
  .hero-kicker{margin-bottom:20px;font-size:10px}
  .hero-rule{height:32px;margin-bottom:28px}
}

/* ═══════════════════════════
   WRAP
═══════════════════════════ */
.wrap{max-width:960px;margin:0 auto;padding:0 24px 80px}
@media(max-width:700px){.wrap{padding:0 16px 80px}}

/* ═══════════════════════════
   NOTICE
═══════════════════════════ */
.notice-box{
  background:#fff;border:1px solid var(--line);
  border-left:3px solid var(--ink);
  padding:16px 20px;margin-top:36px;
}
.notice-box p{
  font-family:'Noto Serif KR',serif;font-size:13px;
  font-weight:300;color:var(--ink2);line-height:1.9;
}
.notice-box strong{color:var(--ink);font-weight:600}

/* ═══════════════════════════
   SEC DIVIDER
═══════════════════════════ */
.sec-div{
  display:flex;align-items:center;gap:14px;margin:48px 0 20px;
}
.sec-div::before,.sec-div::after{content:'';flex:1;height:1px;background:var(--line)}
.sec-div span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap;font-weight:300}

/* ═══════════════════════════
   DISCOUNT CARDS
═══════════════════════════ */
.disc-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;margin-bottom:2px;
}
.disc-card{
  background:#fff;border:1px solid var(--line);
  padding:18px 16px;transition:border-color .2s,box-shadow .2s;
}
.disc-card:hover{border-color:var(--line2);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.dc-label{
  font-size:10.5px;font-weight:700;color:var(--ink);
  letter-spacing:.06em;text-transform:uppercase;
  padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--line);
}
.dc-body{font-family:'Noto Serif KR',serif;font-size:12.5px;font-weight:300;color:var(--ink2);line-height:1.85}
.dc-body .plus{color:var(--green);font-weight:700;font-size:14px}
a.fleet-disc-card{
  background:var(--ink);text-decoration:none;
  display:flex;align-items:center;gap:12px;
  grid-column:span 3;border:1px solid var(--ink);
  padding:18px 20px;transition:background .2s;cursor:pointer;
}
a.fleet-disc-card:hover{background:#2a2a2a}
a.fleet-disc-card .dc-label{color:#fff;border-bottom-color:rgba(255,255,255,.12)}
a.fleet-disc-card .dc-body{color:rgba(255,255,255,.5)}
.fleet-arrow-ico{margin-left:auto;font-size:18px;color:rgba(255,255,255,.35);flex-shrink:0}
@media(max-width:700px){
  .disc-grid{grid-template-columns:1fr 1fr;gap:8px}
  a.fleet-disc-card{grid-column:span 2}
}
@media(max-width:440px){
  .disc-grid{grid-template-columns:1fr}
  a.fleet-disc-card{grid-column:span 1}
}

/* ═══════════════════════════
   SPECIAL / EVENT
═══════════════════════════ */
.special-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sp-block{background:#fff;border:1px solid var(--line);padding:22px 22px}
.sp-block.dark{background:var(--ink);border-color:var(--ink)}
.sp-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sp-block.dark .sp-eyebrow{color:rgba(255,255,255,.3)}
.sp-block h3{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:10px}
.sp-block.dark h3{color:#fff}
.sp-block p{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:300;color:var(--ink2);line-height:1.8}
.sp-block.dark p{color:rgba(255,255,255,.5)}
.sp-inner{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sp-item{border:1px solid var(--line);padding:13px 14px;background:var(--bg2)}
.sp-item-dark{border:1px solid rgba(255,255,255,.12);padding:13px 14px;background:rgba(255,255,255,.05)}
.sp-ilabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sp-item-dark .sp-ilabel{color:rgba(255,255,255,.3)}
.sp-ival{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:300;color:var(--ink2);line-height:1.6}
.sp-irate{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:#fff;line-height:1}
.sp-irate span{font-size:16px;font-weight:300;opacity:.45;margin-left:2px}
.sp-irate small{font-family:'Noto Sans KR',sans-serif;font-size:11px;color:rgba(255,255,255,.35);display:block;margin-top:5px;font-weight:300}
@media(max-width:700px){.special-row{grid-template-columns:1fr}}

.ev-panel{background:#fff;border:1px solid var(--line);border-top:2px solid var(--ink);padding:20px 22px;margin-top:8px}
.ev-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.ev-chip{font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:#fff;padding:4px 10px;font-weight:600;flex-shrink:0}
.ev-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--ink)}
.ev-rows{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin-bottom:14px}
.ev-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px;white-space:nowrap}
.ev-v{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:300;color:var(--ink2)}
.benefit-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bp{background:var(--bg2);border:1px solid var(--line);padding:12px 14px}
.bp-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.bp-val{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:300;color:var(--ink2)}

/* ═══════════════════════════
   SECTION HEADER
═══════════════════════════ */
.sec-hd{padding:56px 0 6px;border-top:1px solid var(--line);margin-top:56px}
.sec-hd.no-border{border-top:none;margin-top:0}
.sec-eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:300}
.sec-hd h2{font-family:'Playfair Display',serif;font-size:clamp(26px,4vw,38px);font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.1}
.sec-hd h2 em{font-style:italic;font-weight:300;color:var(--muted)}
.sec-sub{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:300;color:var(--muted);margin-top:8px;line-height:1.85}

/* ═══════════════════════════
   FINANCE
═══════════════════════════ */
.fin-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.fin-card{overflow:hidden;background:#fff;border:1px solid var(--line)}
.fin-card-hd{background:var(--ink);padding:11px 20px;display:flex;justify-content:space-between;align-items:baseline}
.fc-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);font-weight:300}
.fc-sub{font-size:13px;color:#fff;font-weight:600;letter-spacing:.02em}
.fin-card-body{padding:22px 20px 24px}
.fc-target{font-family:'Noto Serif KR',serif;font-size:12.5px;font-weight:300;color:var(--muted);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.fc-big-rate{font-family:'Playfair Display',serif;font-size:62px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-.02em}
.fc-big-rate sup{font-size:22px;vertical-align:top;padding-top:10px;font-weight:300;color:var(--muted)}
.fc-note{font-family:'Noto Serif KR',serif;font-size:12px;font-weight:300;color:var(--muted);margin-top:10px;line-height:1.7}
@media(max-width:700px){.fin-row{grid-template-columns:1fr}}

.focus-block{background:#fff;border:1px solid var(--line);border-top:2px solid var(--ink);margin-top:8px;overflow:hidden}
.focus-hd{background:var(--bg2);padding:11px 20px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:6px}
.fh-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);font-weight:700}
.fh-target{font-size:12px;color:var(--ink2);font-family:'Noto Serif KR',serif;font-weight:300}
.focus-body{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.focus-item{background:#fff;padding:22px 12px 24px;text-align:center;transition:background .15s}
.focus-item.featured{background:var(--ink)}
.focus-item:hover:not(.featured){background:var(--bg2)}
.fi-term{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:300}
.focus-item.featured .fi-term{color:rgba(255,255,255,.3)}
.fi-rate{font-family:'Playfair Display',serif;font-size:46px;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-.02em}
.focus-item.featured .fi-rate{color:#fff}
.fi-rate sup{font-size:17px;vertical-align:top;padding-top:8px;font-weight:300;color:var(--muted)}
.focus-item.featured .fi-rate sup{color:rgba(255,255,255,.35)}
.fi-badge{display:inline-block;margin-top:12px;padding:4px 12px;font-size:11px;font-weight:500;letter-spacing:.06em;background:var(--bg3);color:var(--muted)}
.focus-item.featured .fi-badge{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
.focus-fn{padding:10px 20px;font-family:'Noto Serif KR',serif;font-size:12px;font-weight:300;color:var(--muted);border-top:1px solid var(--line);background:var(--bg2)}
@media(max-width:540px){.focus-body{grid-template-columns:1fr}}

.premium-block{background:#fff;border:1px solid var(--line);border-top:2px solid var(--ink);margin-top:8px}
.prem-hd{background:var(--bg2);padding:11px 20px;border-bottom:1px solid var(--line)}
.ph-label{font-size:10.5px;letter-spacing:.06em;color:var(--ink);font-weight:700;text-transform:uppercase}
.prem-body{padding:20px 20px 22px}
.prem-note{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:300;color:var(--muted);margin-bottom:18px}
.rate-compare{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.rc-box{text-align:center;padding:14px 16px;border:1px solid var(--line);background:var(--bg2);flex:1;min-width:90px}
.rc-box.active{border-color:var(--ink);background:#fff}
.rc-lbl{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.rc-val{font-family:'Playfair Display',serif;font-size:21px;font-weight:600;color:var(--ink)}
.rc-val.old{color:var(--muted2);text-decoration:line-through;font-weight:300}
.rc-val.new{color:var(--green)}
.vs-word{font-family:'Playfair Display',serif;font-size:14px;font-style:italic;color:var(--muted2);align-self:center}
.diff-tag{background:var(--green);color:#fff;font-size:11.5px;padding:6px 14px;font-weight:600;letter-spacing:.04em;align-self:center;white-space:nowrap}
.prem-extra{font-family:'Noto Serif KR',serif;font-size:12px;font-weight:300;color:var(--muted);margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:500px){.rate-compare{flex-direction:column}.vs-word{text-align:center}}

/* ═══════════════════════════
   PRICE CARD
═══════════════════════════ */
.price-legend{
  display:flex;gap:18px;padding:10px 0;
  margin-top:14px;border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--muted);flex-wrap:wrap;
}
.price-legend span::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.lg-msrp::before{background:var(--muted2)}
.lg-disc::before{background:var(--red)}
.lg-final::before{background:var(--blue)}

.pcard{
  margin-top:28px;background:#fff;
  border:1px solid var(--line);
  border-top:2px solid var(--ink);
  scroll-margin-top:136px;
  overflow:hidden;
